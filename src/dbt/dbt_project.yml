name: trn_uts_dateng
version: "1.0.0"
config-version: 2

# Connection profile. Local runs read ~/.dbt/profiles.yml; dbt Cloud uses its own connection.
profile: trn_uts_dateng

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

# Medallion layers. Bronze is the raw schema loaded by Airflow (declared as a source).
# Schema names: target "prod" (dbt Cloud) writes silver / gold / datamart; any other target
# writes <target schema>_silver etc. (macros/generate_schema_name.sql), so local runs never
# touch the production snapshots.
models:
  trn_uts_dateng:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    datamart:
      +schema: datamart
      +materialized: view

snapshots:
  trn_uts_dateng:
    +schema: silver
